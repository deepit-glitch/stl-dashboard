<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>STL Manpower Entry</title>
<script src="stl_data.js?v=20260605"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#eef2f7;-webkit-font-smoothing:antialiased}
input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none}
input[type=number]{-moz-appearance:textfield}
::-webkit-scrollbar{width:5px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
</style>
</head>
<body>
<div id="root"></div>
<script>
const WORKER = "https://square-flower-57b5.deepit.workers.dev";

/* ── month config ────────────────────────────────────────── */
const MANPOWER_MONTHS = [
  {key:"2026-04", label:"April 2026",   short:"APR", days:30},
  {key:"2026-05", label:"May 2026",     short:"MAY", days:31},
  {key:"2026-06", label:"June 2026",    short:"JUN", days:30},
];

/* ── helpers ─────────────────────────────────────────────── */
function getToken(){ return localStorage.getItem("stl_token"); }
function clearSession(){ ["stl_token","stl_role","stl_name","stl_dept","stl_demo"].forEach(k=>localStorage.removeItem(k)); }

function todayISOStr(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}
function yesterdayStr(){
  const d = new Date();
  d.setDate(d.getDate() - 1);
  return d.toISOString().slice(0,10);
}
function formatDisplay(dateStr){
  const [y,m,d] = dateStr.split("-");
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${parseInt(d)} ${months[parseInt(m)-1]} ${y}`;
}
function dateToMonthKey(dateStr){ return dateStr.slice(0,7); }
function currentMonthKey(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0");
}

/* ── dept configs ────────────────────────────────────────── */
const DEPTS_NALAGARH = [
  { id:"weaving",          label:"Weaving",           color:"#2563eb", icon:"🧵" },
  { id:"sizing",           label:"Sizing",             color:"#7c3aed", icon:"📏" },
  { id:"sectionalWarping", label:"Sectional Warping",  color:"#0891b2", icon:"🔄" },
  { id:"yarnDyeing",       label:"Yarn Dyeing",        color:"#d97706", icon:"🎨" },
  { id:"fabricDyeing",     label:"Fabric Dyeing",      color:"#059669", icon:"🧪" },
  { id:"finishing",        label:"Finishing",           color:"#dc2626", icon:"📦" },
  { id:"finishing1",       label:"Finishing 1",         color:"#ea580c", icon:"📋" },
];
const DEPTS_NOIDA = [
  { id:"noidaFinishing",   label:"Noida Finishing",    color:"#0f766e", icon:"🏭" },
];

/* ── app state ───────────────────────────────────────────── */
const mkNow = currentMonthKey();
const defMonth = MANPOWER_MONTHS.find(m => m.key === mkNow) || MANPOWER_MONTHS[1];

let state = {
  screen:        "loading",
  userName:      "",
  userRole:      "",
  selectedDate:  yesterdayStr(),
  calMonth:      defMonth,
  monthEntries:  {},   // {YYYY-MM-DD: true}  — populated by prefetch
  values: {
    weaving:"", sizing:"", sectionalWarping:"", yarnDyeing:"",
    fabricDyeing:"", finishing:"", finishing1:"", noidaFinishing:""
  },
  savedFor:      null,
  saving:        false,
  loading:       false,
  calLoading:    false,
  toast:         null,
  existingEntry: false,
};

function setState(patch){ Object.assign(state, patch); render(); }

/* ── role helpers ────────────────────────────────────────── */
const urlParams = new URLSearchParams(window.location.search);
function isNoidaMode(){
  return state.userRole === "hr_noida" ||
    (state.userRole === "admin" && urlParams.get("loc") === "noida");
}
function getActiveDepts(){ return isNoidaMode() ? DEPTS_NOIDA : DEPTS_NALAGARH; }
function emptyValues(){
  return { weaving:"", sizing:"", sectionalWarping:"", yarnDyeing:"",
           fabricDyeing:"", finishing:"", finishing1:"", noidaFinishing:"" };
}

/* ── calendar prefetch ───────────────────────────────────── */
/* ── stl_data.js helpers (same source as management dashboard) ── */
// Maps "2026-06" -> "Jun-26"
function toStlMonthKey(mk){
  const [y,m] = mk.split('-').map(Number);
  const mn=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return mn[m-1]+'-'+String(y).slice(2);
}
// Maps dept.id -> DAILY_OV array name
const DEPT_TO_ARR = {
  weaving:'mp_weaving', sizing:'mp_sizing', sectionalWarping:'mp_warping',
  yarnDyeing:'mp_yarn', fabricDyeing:'mp_fabdye', finishing:'mp_finishing',
  finishing1:'mp_fin1', noidaFinishing:'noida_manpower'
};
// Returns {weaving:N, sizing:N, ...} from stl_data.js for a given date, or null
function readStlDate(dateStr){
  try {
    if (typeof DAILY_OV === 'undefined') return null;
    const md = DAILY_OV[toStlMonthKey(dateStr.slice(0,7))];
    if (!md || !md.dates) return null;
    const idx = md.dates.indexOf(dateStr.slice(8,10));
    if (idx === -1) return null;
    const out = {};
    Object.entries(DEPT_TO_ARR).forEach(([id, arr]) => {
      const v = md[arr] && md[arr][idx];
      out[id] = (v > 0) ? v : undefined;
    });
    return out;
  } catch(e){ return null; }
}

/* ── Worker range fallback (for dates not yet in stl_data.js) ── */
async function fetchRange(monthKey){
  const token = getToken();
  try {
    const r = await fetch(
      `${WORKER}/manpower-range?start=${monthKey}-01&end=${monthKey}-31`,
      { headers: token ? {"X-Session-Token": token} : {} }
    );
    const d = await r.json();
    const map = {};
    if (d.ok && Array.isArray(d.data)){
      d.data.forEach(e => { if (e.date && e.data) map[e.date] = e.data; });
    }
    return map;
  } catch(e){ return {}; }
}

async function prefetchMonthEntries(monthKey){
  setState({ calLoading: true });
  try {
    const fetched = {};
    const depts = getActiveDepts();
    // 1. Mark dates from stl_data.js
    const stlKey = toStlMonthKey(monthKey);
    if (typeof DAILY_OV !== 'undefined' && DAILY_OV[stlKey]) {
      const md = DAILY_OV[stlKey];
      (md.dates || []).forEach((day, idx) => {
        const hasData = depts.some(d => {
          const arr = md[DEPT_TO_ARR[d.id]];
          return arr && arr[idx] > 0;
        });
        if (hasData) fetched[`${monthKey}-${day}`] = true;
      });
    }
    // 2. Also check Worker for very recent dates not yet in stl_data.js
    const map = await fetchRange(monthKey);
    state._rangeCache = Object.assign({}, state._rangeCache || {}, map);
    Object.keys(map).forEach(ds => {
      if (!fetched[ds] && depts.some(d => map[ds][d.id] != null)) fetched[ds] = true;
    });
    setState({ monthEntries: Object.assign({}, state.monthEntries, fetched), calLoading: false });
  } catch(e){
    setState({ calLoading: false });
  }
}

/* ── API calls ───────────────────────────────────────────── */
async function loadDate(dateStr){
  setState({ loading: true, existingEntry: false });
  try {
    const depts = getActiveDepts();
    // 1. Try stl_data.js first — same source as management dashboard
    const stl = readStlDate(dateStr);
    if (stl && depts.some(d => stl[d.id] != null)) {
      setState({
        values: {
          weaving:          String(stl.weaving          ?? ""),
          sizing:           String(stl.sizing           ?? ""),
          sectionalWarping: String(stl.sectionalWarping ?? ""),
          yarnDyeing:       String(stl.yarnDyeing       ?? ""),
          fabricDyeing:     String(stl.fabricDyeing     ?? ""),
          finishing:        String(stl.finishing        ?? ""),
          finishing1:       String(stl.finishing1       ?? ""),
          noidaFinishing:   String(stl.noidaFinishing   ?? ""),
        },
        savedFor: dateStr, existingEntry: true, loading: false,
      });
      return;
    }
    // 2. Fall back to Worker range (for today / yesterday not yet in stl_data.js)
    const monthKey = dateStr.slice(0,7);
    let cache = state._rangeCache || {};
    if (!Object.keys(cache).some(k => k.startsWith(monthKey))) {
      cache = await fetchRange(monthKey);
      state._rangeCache = Object.assign({}, state._rangeCache || {}, cache);
    }
    const mp = cache[dateStr] || {};
    const hasOurData = depts.some(d => mp[d.id] != null);
    if (hasOurData) {
      setState({
        values: {
          weaving:          String(mp.weaving          ?? ""),
          sizing:           String(mp.sizing           ?? ""),
          sectionalWarping: String(mp.sectionalWarping ?? ""),
          yarnDyeing:       String(mp.yarnDyeing       ?? ""),
          fabricDyeing:     String(mp.fabricDyeing     ?? ""),
          finishing:        String(mp.finishing        ?? ""),
          finishing1:       String(mp.finishing1       ?? ""),
          noidaFinishing:   String(mp.noidaFinishing   ?? ""),
        },
        savedFor: dateStr, existingEntry: true, loading: false,
      });
    } else {
      setState({ values: emptyValues(), savedFor: null, existingEntry: false, loading: false });
    }
  } catch(e){
    setState({ loading: false });
    showToast("Failed to load data", "err");
  }
}

async function saveData(){
  const vals = state.values;
  const depts = getActiveDepts();
  for (const d of depts){
    const v = parseInt(vals[d.id]);
    if (isNaN(v) || v < 0){ showToast(`Please enter a valid number for ${d.label}`, "err"); return; }
  }
  setState({ saving: true });
  // Merge: start with whatever is already in the Worker for this date (preserves the other
  // location's fields), strip Worker metadata, then overwrite with our new values.
  const existing = Object.assign({}, state._rangeCache?.[state.selectedDate] || {});
  delete existing.enteredBy;
  delete existing.enteredAt;
  const payload = Object.assign(existing, {});
  depts.forEach(d => { payload[d.id] = parseInt(vals[d.id]); });
  try {
    const r = await fetch(`${WORKER}/manpower/${state.selectedDate}`, {
      method: "POST",
      headers: { "Content-Type":"application/json", "X-Session-Token": getToken() },
      body: JSON.stringify(payload),
    });
    const resp = await r.json();
    if (resp.ok) {
      // Update local cache with the merged payload so loadDate stays consistent
      if (!state._rangeCache) state._rangeCache = {};
      state._rangeCache[state.selectedDate] = Object.assign({}, payload);
      const merged = Object.assign({}, state.monthEntries, {[state.selectedDate]: true});
      setState({ saving: false, savedFor: state.selectedDate, existingEntry: true, monthEntries: merged });
      showToast(`Saved for ${formatDisplay(state.selectedDate)}`, "ok");
    } else {
      setState({ saving: false });
      showToast(resp.error || "Save failed", "err");
    }
  } catch(e) {
    setState({ saving: false });
    showToast("Network error — please retry", "err");
  }
}

function showToast(msg, type){
  setState({ toast: { msg, type } });
  setTimeout(() => setState({ toast: null }), 3500);
}

function onDateChange(newDate){
  // Also switch calendar month if needed
  const mk = dateToMonthKey(newDate);
  const newCalMonth = MANPOWER_MONTHS.find(m => m.key === mk) || state.calMonth;
  setState({ selectedDate: newDate, calMonth: newCalMonth });
  loadDate(newDate);
}

function onCalMonthChange(monthObj){
  setState({ calMonth: monthObj });
  // Prefetch if not already done
  const alreadyFetched = Object.keys(state.monthEntries).some(k => k.startsWith(monthObj.key));
  if (!alreadyFetched) prefetchMonthEntries(monthObj.key);
}

function onCalDayClick(dateStr){
  const todayStr = todayISOStr();
  if (dateStr > todayStr) return; // block future
  onDateChange(dateStr);
}

function onValueChange(id, val){
  state.values[id] = val;
  render();
}

function logout(){
  const isDemo = localStorage.getItem("stl_demo") === "true";
  clearSession();
  window.location.href = isDemo ? "demo_login.html" : "login.html";
}

/* ── calendar renderer ───────────────────────────────────── */
function renderCalendar(){
  const mo = state.calMonth;
  const [y, m] = mo.key.split("-").map(Number);
  const firstDow  = new Date(y, m-1, 1).getDay();
  const todayStr  = todayISOStr();
  const todayMk   = todayStr.slice(0,7);
  const todayDay  = todayMk === mo.key ? parseInt(todayStr.slice(8)) : null;
  const selMk     = state.selectedDate.slice(0,7);
  const selDay    = selMk === mo.key ? parseInt(state.selectedDate.slice(8)) : null;
  const accent    = isNoidaMode() ? "#0f766e" : "#6366f1";

  let dayCells = "";
  // offset blanks
  for (let i = 0; i < firstDow; i++) dayCells += `<div></div>`;
  for (let day = 1; day <= mo.days; day++){
    const ds  = `${y}-${String(m).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
    const isSaved    = !!state.monthEntries[ds];
    const isSelected = selDay === day;
    const isToday    = todayDay === day;
    const isFuture   = ds > todayStr;

    let bg    = "transparent";
    let color = "#475569";
    let border= "none";
    let fw    = 500;
    if (isSelected){ bg = accent; color = "#fff"; fw = 700; }
    else if (isSaved){ bg = "#dcfce7"; color = "#15803d"; }
    if (isToday && !isSelected) border = `2px solid ${accent}`;

    const opacity  = isFuture ? "0.3" : "1";
    const cursor   = isFuture ? "default" : "pointer";
    const onclick  = isFuture ? "" : `onCalDayClick('${ds}')`;

    dayCells += `<button onclick="${onclick}"
      style="width:100%;aspect-ratio:1/1;border-radius:6px;font-family:monospace;font-size:10px;
             font-weight:${fw};background:${bg};color:${color};border:${border};
             cursor:${cursor};opacity:${opacity};transition:all 0.12s;padding:0;"
      >${day}</button>`;
  }

  const monthTabsHtml = MANPOWER_MONTHS.map(mm => {
    const active = mm.key === mo.key;
    return `<button onclick="onCalMonthChange(MANPOWER_MONTHS.find(x=>x.key==='${mm.key}'))"
      style="padding:3px 12px;border-radius:5px;font-family:monospace;font-size:10px;font-weight:700;
             cursor:pointer;border:1.5px solid ${active ? '#0f172a' : '#e2e8f0'};
             background:${active ? '#0f172a' : 'transparent'};color:${active ? '#fff' : '#94a3b8'};
             transition:all 0.12s;">${mm.short}</button>`;
  }).join("");

  // selected date info panel
  const [sy,sm,sd] = state.selectedDate.split("-");
  const mNames = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const dispDate = `${parseInt(sd)} ${mNames[parseInt(sm)-1]} ${sy}`;
  const isYest  = state.selectedDate === yesterdayStr();
  const statusLabel = isYest ? "Today's entry" : "Editing past data";
  const statusColor = isYest ? "#16a34a" : "#ea580c";

  return `
    <div style="width:236px;flex-shrink:0;display:flex;flex-direction:column;gap:10px;">
      <!-- calendar card -->
      <div style="background:#fff;border-radius:12px;padding:14px;border:1px solid #e2e8f0;box-shadow:0 1px 4px rgba(0,0,0,0.05);">
        <!-- month tabs -->
        <div style="display:flex;gap:4px;margin-bottom:10px;">${monthTabsHtml}</div>
        <!-- label -->
        <div style="font-size:9px;font-weight:700;color:#94a3b8;letter-spacing:2px;margin-bottom:8px;font-family:monospace;">${mo.label.toUpperCase()}</div>
        <!-- grid -->
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:8px;">
          ${["S","M","T","W","T","F","S"].map(d=>`<div style="font-size:9px;text-align:center;color:#cbd5e1;font-weight:700;padding-bottom:4px;">${d}</div>`).join("")}
          ${dayCells}
        </div>
        <!-- legend -->
        <div style="display:flex;gap:8px;padding-top:8px;border-top:1px solid #f8fafc;flex-wrap:wrap;">
          <div style="display:flex;align-items:center;gap:4px;font-size:9px;color:#94a3b8;">
            <div style="width:8px;height:8px;border-radius:3px;background:${accent};"></div>Selected
          </div>
          <div style="display:flex;align-items:center;gap:4px;font-size:9px;color:#94a3b8;">
            <div style="width:8px;height:8px;border-radius:3px;background:#dcfce7;"></div>Saved
          </div>
          <div style="display:flex;align-items:center;gap:4px;font-size:9px;color:#94a3b8;">
            <div style="width:8px;height:8px;border-radius:3px;border:2px solid ${accent};background:transparent;"></div>Today
          </div>
        </div>
        ${state.calLoading ? `<div style="font-size:10px;color:#94a3b8;margin-top:8px;font-style:italic;">Loading saved dates…</div>` : ""}
      </div>
      <!-- selected date info -->
      <div style="background:#fff;border-radius:10px;padding:12px 14px;border:1px solid #e2e8f0;box-shadow:0 1px 4px rgba(0,0,0,0.04);">
        <div style="font-size:9px;font-weight:700;color:#94a3b8;letter-spacing:2px;text-transform:uppercase;">Selected Date</div>
        <div style="font-size:17px;font-weight:800;color:#0f172a;margin-top:5px;font-family:monospace;">${dispDate}</div>
        <div style="margin-top:5px;font-size:11px;font-weight:700;color:${statusColor};">${statusLabel}</div>
        ${state.existingEntry ? `<div style="margin-top:4px;font-size:11px;color:#059669;font-weight:600;">✓ Data saved</div>` : ""}
      </div>
    </div>`;
}

/* ── session check ───────────────────────────────────────── */
async function init(){
  const token = getToken();
  if (!token){ window.location.href = "login.html"; return; }
  try {
    const r = await fetch(`${WORKER}/auth/session`, { headers:{"X-Session-Token":token} });
    if (!r.ok){ clearSession(); window.location.href = "login.html"; return; }
    const d = await r.json();
    if (!d.ok){ clearSession(); window.location.href = "login.html"; return; }
    if (d.role !== "hr" && d.role !== "hr_noida" && d.role !== "admin"){
      window.location.href = "login.html"; return;
    }
    state.userName = d.name || d.mobile || "";
    state.userRole = d.role || "";
    state.screen   = "entry";
    render();
    // load today's data and prefetch calendar
    loadDate(state.selectedDate);
    prefetchMonthEntries(state.calMonth.key);
  } catch(e) {
    state.userName = localStorage.getItem("stl_name") || "";
    state.userRole = localStorage.getItem("stl_role") || "";
    state.screen   = "entry";
    render();
    loadDate(state.selectedDate);
    prefetchMonthEntries(state.calMonth.key);
  }
}

/* ── render ──────────────────────────────────────────────── */
function render(){
  const root = document.getElementById("root");

  if (state.screen === "loading"){
    root.innerHTML = `
      <div style="min-height:100vh;background:#eef2f7;display:flex;align-items:center;justify-content:center;">
        <div style="text-align:center;">
          <div style="width:48px;height:48px;border:3px solid #6366f1;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 16px;"></div>
          <div style="font-size:13px;color:#64748b;font-weight:600;">Verifying session…</div>
        </div>
      </div>
      <style>@keyframes spin{to{transform:rotate(360deg)}}</style>`;
    return;
  }

  const depts      = getActiveDepts();
  const accentColor= isNoidaMode() ? "#0f766e" : "#6366f1";
  const locLabel   = isNoidaMode() ? "Noida (Plant 1600)" : "Nalagarh";
  const allFilled  = depts.every(d => state.values[d.id] !== "" && !isNaN(parseInt(state.values[d.id])));
  const isYest     = state.selectedDate === yesterdayStr();

  root.innerHTML = `
    <style>
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes fadeIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
      .dept-card{background:#fff;border-radius:14px;padding:18px 20px;display:flex;align-items:center;gap:16px;border:2px solid #e2e8f0;transition:border-color 0.15s,box-shadow 0.15s;margin-bottom:10px;}
      .dept-card:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 15%,transparent);}
      .dept-input{border:none;outline:none;font-size:22px;font-weight:800;color:#0f172a;width:120px;text-align:right;font-family:monospace;background:transparent;}
      .dept-input::placeholder{color:#cbd5e1;font-weight:600;}
      .save-btn{width:100%;padding:16px;border:none;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,${accentColor},${accentColor}dd);color:#fff;letter-spacing:0.5px;transition:opacity 0.2s,transform 0.1s;box-shadow:0 4px 14px ${accentColor}55;}
      .save-btn:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
      .save-btn:hover:not(:disabled){opacity:0.92;transform:translateY(-1px);}
      .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);padding:12px 24px;border-radius:10px;font-size:13px;font-weight:700;animation:fadeIn 0.25s ease;z-index:999;box-shadow:0 4px 20px rgba(0,0,0,0.15);white-space:nowrap;}
    </style>

    <!-- HEADER -->
    <div style="background:#0f172a;padding:0 20px;height:54px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid ${accentColor};position:sticky;top:0;z-index:100;">
      <div style="font-family:monospace;font-size:12px;font-weight:700;color:#818cf8;letter-spacing:2px;">STL DASHBOARDS</div>
      <div style="display:flex;align-items:center;gap:12px;">
        ${state.userName ? `<span style="font-size:12px;color:#94a3b8;font-weight:600;">${state.userName}</span>` : ""}
        <button onclick="logout()" style="padding:5px 14px;border-radius:6px;border:1px solid #334155;background:transparent;color:#94a3b8;cursor:pointer;font-size:12px;font-weight:600;">Logout</button>
      </div>
    </div>

    <!-- MAIN CONTENT -->
    <div style="max-width:1080px;margin:0 auto;padding:18px 16px 40px;">

      <!-- TWO-COLUMN LAYOUT -->
      <div style="display:flex;gap:14px;align-items:flex-start;flex-wrap:wrap;">

        <!-- LEFT: calendar sidebar -->
        ${renderCalendar()}

        <!-- RIGHT: form -->
        <div style="flex:1;min-width:300px;">

          <!-- title -->
          <div style="margin-bottom:20px;">
            <div style="font-size:11px;font-weight:700;color:${accentColor};letter-spacing:2px;text-transform:uppercase;margin-bottom:6px;">Daily Entry · ${locLabel}</div>
            <h1 style="font-size:24px;font-weight:900;color:#0f172a;letter-spacing:-0.5px;">Manpower Headcount</h1>
            <p style="font-size:13px;color:#64748b;margin-top:4px;">Enter the number of workers present in each department.</p>
          </div>

          <!-- loading state -->
          ${state.loading ? `
          <div style="text-align:center;padding:40px 0;">
            <div style="width:32px;height:32px;border:3px solid ${accentColor};border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;margin:0 auto 12px;"></div>
            <div style="font-size:13px;color:#64748b;font-weight:600;">Loading…</div>
          </div>` : `

          <!-- dept fields -->
          <div style="margin-bottom:20px;">
            ${depts.map(d => `
              <div class="dept-card" style="--accent:${d.color}">
                <div style="width:42px;height:42px;border-radius:12px;background:${d.color}18;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;">${d.icon}</div>
                <div style="flex:1;">
                  <div style="font-size:13px;font-weight:700;color:#0f172a;">${d.label}</div>
                  <div style="font-size:11px;color:#94a3b8;margin-top:1px;">Headcount</div>
                </div>
                <div style="display:flex;align-items:center;gap:4px;">
                  <input class="dept-input" type="number" min="0" max="999" placeholder="—"
                    value="${state.values[d.id]}"
                    oninput="onValueChange('${d.id}', this.value)"
                    style="color:${state.values[d.id] !== '' ? d.color : '#cbd5e1'};" />
                  <span style="font-size:12px;color:#94a3b8;font-weight:600;">ppl</span>
                </div>
              </div>`).join("")}
          </div>

          <!-- save button -->
          <button class="save-btn" onclick="saveData()" ${(!allFilled || state.saving) ? "disabled" : ""}>
            ${state.saving
              ? `<span style="display:inline-flex;align-items:center;gap:8px;"><span style="width:16px;height:16px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;display:inline-block;"></span>Saving…</span>`
              : state.existingEntry
                ? `✏️ Update ${formatDisplay(state.selectedDate)}`
                : `💾 Save ${formatDisplay(state.selectedDate)}`
            }
          </button>
          ${!allFilled ? `<p style="text-align:center;font-size:12px;color:#94a3b8;margin-top:10px;">Fill in all departments to save.</p>` : ""}
          `}

        </div><!-- /right -->
      </div><!-- /two-column -->
    </div><!-- /main -->

    <!-- TOAST -->
    ${state.toast ? `
    <div class="toast" style="background:${state.toast.type === 'ok' ? '#059669' : '#dc2626'};color:#fff;">
      ${state.toast.type === 'ok' ? '✓' : '✕'} ${state.toast.msg}
    </div>` : ""}
  `;
}

/* ── boot ────────────────────────────────────────────────── */
render();
init();
</script>
</body>
</html>
