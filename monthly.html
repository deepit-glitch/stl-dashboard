<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>STL Monthly Dashboard</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="depts.js?v=20260709"></script>
<script src="kpi_months.js?v=20260702"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body,#root{height:100%;min-height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;background:#f0f4f8;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:3px}
@media print{.no-print{display:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script>
// Wait for all scripts to load before running
window.addEventListener('load', async function() {
  // Demo mode bypass — skip worker entirely
  if (localStorage.getItem('stl_demo') === 'true' && localStorage.getItem('stl_token') === 'demo') {
    window.STL_ROLE  = localStorage.getItem('stl_role')  || 'management';
    window.STL_NAME  = localStorage.getItem('stl_name')  || 'Demo User';
    window.STL_DEPT  = localStorage.getItem('stl_dept')  || '';
    window.STL_TOKEN = 'demo';
  } else {
  // Session guard
  const __token = localStorage.getItem('stl_token');
  if (!__token) { window.location.href='login.html'; return; }
  try {
    const __sr = await fetch('https://square-flower-57b5.deepit.workers.dev/auth/session',{headers:{'X-Session-Token':__token}});
    if (!__sr.ok) { localStorage.removeItem('stl_token'); window.location.href='login.html'; return; }
    const __sd = await __sr.json();
    if (!__sd.ok) { window.location.href='login.html'; return; }
    window.STL_ROLE=__sd.role; window.STL_NAME=__sd.name; window.STL_DEPT=__sd.dept; window.STL_TOKEN=__token;
  } catch(e) { window.STL_ROLE=localStorage.getItem('stl_role')||'management'; window.STL_TOKEN=__token; }
  }

  try {
    if (typeof React === 'undefined' || typeof ReactDOM === 'undefined') {
      document.getElementById('root').innerHTML = '<div style="padding:40px;font-family:monospace;color:#dc2626;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;margin:40px">ERROR: React failed to load from CDN. Check your internet connection and reload.</div>';
      return;
    }


var useState = React.useState;
var useEffect = React.useEffect;
var CE = React.createElement;


var D = "daily", M = "monthly";
var MONTHS = window.STL_KPI_MONTHS;
function lastDay(mk){ return (MONTHS.find(function(m){return m.key===mk;})||MONTHS[0]).days; }
var DEPTS = (window.DEPTS || []).filter(function(d){ return d.id !== "NAL_MP" && d.id !== "NOI_MP"; });

var SC  = {g:"#16a34a", w:"#ca8a04", b:"#dc2626", n:"#94a3b8"};
var SBG = {g:"#f0fdf4", w:"#fefce8", b:"#fef2f2", n:"#f8fafc"};
var SLB = {g:"On Target", w:"Close", b:"Off Target", n:"-"};

var WORKER = "https://square-flower-57b5.deepit.workers.dev";
async function loadData(deptId, mk) {
  var isDemo = localStorage.getItem('stl_demo') === 'true';
  var token  = localStorage.getItem('stl_token') || window.STL_TOKEN || '';
  if (isDemo) { try { return JSON.parse(localStorage.getItem('stl:'+deptId+':'+mk))||{}; } catch(e){return{};} }
  try {
    var r = await fetch(WORKER+'/kpidata/'+encodeURIComponent(deptId)+'/'+encodeURIComponent(mk),
      {headers:{'X-Session-Token':token}});
    if (!r.ok) return {};
    var j = await r.json();
    return j.data || {};
  } catch(e) { return {}; }
}

function getStatus(val, t, hib) {
  if (val === "" || val == null || t == null) return "n";
  var v = +val, tgt = +t;
  if (tgt === 0) return !hib ? (v === 0 ? "g" : "b") : "n";
  var r = v / tgt;
  return hib ? (r >= 0.97 ? "g" : r >= 0.9 ? "w" : "b")
             : (r <= 1.03 ? "g" : r <= 1.1 ? "w" : "b");
}

function getIST() {
  var n = new Date(new Date().toLocaleString("en-US", {timeZone:"Asia/Kolkata"}));
  return {y:n.getFullYear(), m:n.getMonth()+1, d:n.getDate()};
}
function getWorkingDate() {
  var ist = getIST();
  // On the 1st of a new month, roll back to show the previous month
  // so management sees April data by default on May 1, etc.
  var y = ist.y, m = ist.m, d = ist.d;
  if (d === 1) {
    m -= 1;
    if (m < 1) { m = 12; y -= 1; }
    d = new Date(y, m, 0).getDate();
  }
  var mk = y + "-" + String(m).padStart(2,"0");
  if (MONTHS.find(function(mo){return mo.key===mk;})) return Object.assign({},ist,{y:y,m:m,d:d,mk:mk,isTesting:false});
  return {y:2026,m:4,d:30,mk:"2026-04",isTesting:true};
}
var MN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDate(y,m,d) { return d + " " + MN[m-1] + " " + y; }
function fmt2(n) {
  if (n == null) return "-";
  var v = +n;
  if (isNaN(v)) return String(n);
  return Number.isInteger(v) ? String(v) : parseFloat(v.toFixed(3)).toString();
}

function getMonthValue(kpi, mk, entries) {
  var month = MONTHS.find(function(m){return m.key===mk;}) || MONTHS[0];
  if (kpi.freq === "monthly") {
    var ld = month.days;
    var v = entries[ld] ? entries[ld][kpi.id] : undefined;
    return (v !== undefined && v !== "") ? +v : null;
  }
  var vals = [];
  for (var d=1; d<=month.days; d++) {
    var vd = entries[d] ? entries[d][kpi.id] : undefined;
    if (vd !== undefined && vd !== "") vals.push(+vd);
  }
  return vals.length ? vals.reduce(function(a,b){return a+b;},0)/vals.length : null;
}


// Column colours by position in the rolling window (not by month key, since the
// window slides). Index 0 = oldest of the 3, index 2 = the selected end month.
var MCOL_SEQ = [
  {col:"#1d4ed8",bg:"#eff6ff"},
  {col:"#065f46",bg:"#f0fdf4"},
  {col:"#92400e",bg:"#fefce8"}
];
// The rolling comparison window ending at endMkey: that month plus up to the 2
// months before it that exist in MONTHS.
function windowFor(endMkey){
  var idx=MONTHS.findIndex(function(m){return m.key===endMkey;});
  if(idx<0) idx=MONTHS.length-1;
  return MONTHS.slice(Math.max(0,idx-2), idx+1);
}

function KpiCard(props) {
  var kpi=props.kpi, allEntries=props.allEntries, dept=props.dept, months=props.months;
  var sts=months.map(function(mo){
    var v=getMonthValue(kpi,mo.key,allEntries[mo.key]||{});
    return getStatus(v,stlKpiTarget(kpi,mo.key),kpi.hib);
  }).filter(function(s){return s!=="n";});
  var order={b:0,w:1,g:2};
  var worst=sts.length?sts.sort(function(a,b){return (order[a]||3)-(order[b]||3);})[0]:"n";
  var anyData=sts.length>0;

  return CE("div",{style:{background:"#fff",borderRadius:14,overflow:"hidden",
    border:"1.5px solid "+(anyData?SC[worst]+"44":"#e2e8f0"),
    boxShadow:"0 1px 6px rgba(0,0,0,0.06)"}},
    CE("div",{style:{padding:"14px 16px 10px",borderBottom:"1px solid #f8fafc"}},
      CE("div",{style:{display:"flex",alignItems:"flex-start",justifyContent:"space-between",gap:8}},
        CE("div",{style:{flex:1}},
          CE("div",{style:{fontSize:12,fontWeight:700,color:"#1e293b",lineHeight:1.3}},kpi.name),
          CE("div",{style:{display:"flex",gap:5,marginTop:5,flexWrap:"wrap",alignItems:"center"}},
            CE("span",{style:{fontSize:9,fontWeight:700,fontFamily:"monospace",color:"#fff",background:dept.accent,padding:"1px 6px",borderRadius:3}},kpi.unit),
            CE("span",{style:{fontSize:9,fontWeight:600,color:kpi.hib?"#16a34a":"#f97316"}},kpi.hib?"Higher is better":"Lower is better"),
            CE("span",{style:{fontSize:9,fontWeight:700,color:kpi.freq==="daily"?"#16a34a":"#ea580c",background:kpi.freq==="daily"?"#f0fdf4":"#fff7ed",border:"1px solid "+(kpi.freq==="daily"?"#bbf7d0":"#fed7aa"),padding:"1px 6px",borderRadius:3}},kpi.freq==="daily"?"Daily (MTD Avg)":"Monthly")
          )
        ),
        anyData&&CE("div",{style:{width:8,height:8,borderRadius:"50%",background:SC[worst],boxShadow:"0 0 6px "+SC[worst],flexShrink:0,marginTop:3}})
      )
    ),
    CE("div",{style:{display:"grid",gridTemplateColumns:"repeat("+months.length+",1fr)",borderTop:"1px solid #f8fafc"}},
      months.map(function(mo,i){
        var val=getMonthValue(kpi,mo.key,allEntries[mo.key]||{});
        var target=stlKpiTarget(kpi,mo.key);
        var st=getStatus(val,target,kpi.hib);
        var mc=MCOL_SEQ[i%3];
        var pct=(val!==null&&target!=null&&+target!==0)?Math.min(100,kpi.hib?val/target*100:target/val*100):0;
        return CE("div",{key:mo.key,style:{borderLeft:i>0?"1px solid #f1f5f9":"none"}},
          CE("div",{style:{padding:"4px 0",textAlign:"center",background:mc.bg,borderBottom:"1px solid #f1f5f9"}},
            CE("span",{style:{fontSize:9,fontWeight:800,color:mc.col,letterSpacing:1.5}},mo.short)
          ),
          CE("div",{style:{textAlign:"center",padding:"10px 6px"}},
            CE("div",{style:{fontSize:18,fontWeight:900,fontFamily:"monospace",color:val!==null?SC[st]:"#e2e8f0",lineHeight:1}},val!==null?fmt2(val):"-"),
            target!=null&&CE("div",{style:{fontSize:8,color:"#94a3b8",marginTop:2,fontFamily:"monospace"}},"/"+target),
            val!==null&&target!=null&&CE("div",null,
              CE("div",{style:{height:3,background:"#f1f5f9",borderRadius:2,overflow:"hidden",margin:"4px auto",maxWidth:52}},
                CE("div",{style:{height:"100%",borderRadius:2,background:SC[st],width:pct+"%",transition:"width 0.5s"}})
              ),
              CE("div",{style:{fontSize:8,color:SC[st],fontWeight:700}},SLB[st])
            ),
            val===null&&CE("div",{style:{fontSize:8,color:"#e2e8f0",marginTop:4}},"No data")
          )
        );
      })
    )
  );
}

function SummaryStrip(props) {
  var sts=props.sts;
  var cnt=function(s){return sts.filter(function(x){return x===s;}).length;};
  return CE("div",{style:{display:"flex",gap:8,flexWrap:"wrap"}},
    [["g","On Target"],["w","Close"],["b","Off Target"],["n","No Data"]].map(function(pair){
      var s=pair[0],lbl=pair[1];
      return CE("div",{key:s,style:{display:"flex",alignItems:"center",gap:6,padding:"5px 12px",background:SBG[s],border:"1.5px solid "+SC[s]+"44",borderRadius:8}},
        CE("span",{style:{fontSize:17,fontWeight:900,color:SC[s],fontFamily:"monospace"}},cnt(s)),
        CE("div",null,
          CE("div",{style:{fontSize:8,fontWeight:700,color:SC[s],letterSpacing:1,textTransform:"uppercase"}},lbl),
          CE("div",{style:{fontSize:9,color:"#64748b"}},"slots")
        )
      );
    })
  );
}

function doLogout() {
  var isDemo = localStorage.getItem('stl_demo') === 'true';
  var token  = localStorage.getItem('stl_token') || window.STL_TOKEN || '';
  ['stl_token','stl_role','stl_name','stl_dept','stl_demo'].forEach(function(k){localStorage.removeItem(k);});
  if (token && !isDemo) {
    fetch('https://square-flower-57b5.deepit.workers.dev/auth/logout', {method:'POST', headers:{'X-Session-Token':token}}).catch(function(){});
  }
  window.location.href = isDemo ? 'demo_login.html' : 'login.html';
}

function App() {
  var wd=getWorkingDate();
  var sd=useState("Weaving"), selDeptId=sd[0], setSelDeptId=sd[1];
  var sa=useState({}),        allEntries=sa[0], setAllEntries=sa[1];
  var st=useState(0),         tick=st[0],       setTick=st[1];
  var sm=useState(MONTHS[MONTHS.length-1].key), endMkey=sm[0], setEndMkey=sm[1];

  var dept=DEPTS.find(function(d){return d.id===selDeptId;})||DEPTS[0];
  var months=windowFor(endMkey);

  useEffect(function(){
    Promise.all(months.map(function(m){ return loadData(selDeptId,m.key).then(function(d){return{key:m.key,d:d};}); }))
    .then(function(results){
      var data={};
      results.forEach(function(r){data[r.key]=r.d;});
      setAllEntries(data);
    });
  },[selDeptId,endMkey,tick]);
  useEffect(function(){
    var t=setInterval(function(){setTick(function(n){return n+1;});},60000);
    return function(){clearInterval(t);};
  },[]);

  var dailyKpis   = dept.kpis.filter(function(k){return k.freq==="daily";});
  var monthlyKpis = dept.kpis.filter(function(k){return k.freq==="monthly";});

  var allSts=[];
  dept.kpis.forEach(function(kpi){
    months.forEach(function(mo){
      var v=getMonthValue(kpi,mo.key,allEntries[mo.key]||{});
      allSts.push(getStatus(v,stlKpiTarget(kpi,mo.key),kpi.hib));
    });
  });

  return CE("div",{style:{minHeight:"100vh",background:"#f0f4f8"}},
    CE("div",{style:{background:"#0f172a",padding:"0 20px",height:56,display:"flex",alignItems:"center",justifyContent:"space-between",borderBottom:"3px solid "+dept.accent}},
      CE("div",{style:{display:"flex",alignItems:"center",gap:10}},
        CE("div",{style:{width:30,height:30,borderRadius:8,background:dept.accent+"1a",display:"flex",alignItems:"center",justifyContent:"center",border:"1px solid "+dept.accent+"44"}},
          CE("span",{style:{fontFamily:"monospace",fontSize:12,fontWeight:800,color:dept.accent}},"S")
        ),
        CE("div",{style:{fontFamily:"monospace",fontSize:12,fontWeight:700,color:dept.accent,letterSpacing:2}},"STL"),
        CE("div",{style:{width:1,height:16,background:"#334155"}}),
        CE("div",{style:{fontSize:13,fontWeight:600,color:"#e2e8f0"}},"Monthly Dashboard"),
        wd.isTesting&&CE("div",{style:{padding:"2px 8px",background:"#713f12",borderRadius:4,fontSize:9,fontWeight:700,color:"#fef08a",letterSpacing:1}},"TEST MODE")
      ),
      CE("div",{style:{display:"flex",gap:6}},
        CE("button",{onClick:function(){window.print();},style:{padding:"4px 12px",borderRadius:6,border:"1px solid #334155",background:"transparent",color:"#94a3b8",cursor:"pointer",fontSize:11,fontWeight:600}},"Print"),
        CE("button",{onClick:function(){setTick(function(n){return n+1;});},style:{padding:"4px 12px",borderRadius:6,border:"1px solid #334155",background:"transparent",color:"#94a3b8",cursor:"pointer",fontSize:11,fontWeight:600}},"Refresh"),
        CE("button",{onClick:function(){window.location.href="discrepancy.html";},style:{padding:"4px 12px",borderRadius:6,border:"1px solid #334155",background:"transparent",color:"#94a3b8",cursor:"pointer",fontSize:11,fontWeight:600}},"Discrepancy"),
        CE("button",{onClick:doLogout,style:{padding:"4px 12px",borderRadius:6,border:"1px solid #334155",background:"transparent",color:"#94a3b8",cursor:"pointer",fontSize:11,fontWeight:600}},"Logout")
      )
    ),
    CE("div",{style:{background:"#fff",borderBottom:"1px solid #e2e8f0",padding:"9px 20px",display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}},
      CE("span",{style:{fontSize:9,fontWeight:700,color:"#94a3b8",letterSpacing:1.5,marginRight:2}},"DEPT"),
      DEPTS.map(function(d){return CE("button",{key:d.id,onClick:function(){setSelDeptId(d.id);},style:{padding:"4px 13px",borderRadius:20,cursor:"pointer",fontWeight:600,fontSize:11,border:"2px solid "+(d.id===selDeptId?d.accent:"#f1f5f9"),background:d.id===selDeptId?d.accent:"#f8fafc",color:d.id===selDeptId?"#fff":"#64748b",transition:"all 0.15s"}},d.label);}),
      CE("div",{style:{marginLeft:"auto",display:"flex",gap:10,alignItems:"center"}},
        CE("span",{style:{fontSize:9,fontWeight:700,color:"#94a3b8",letterSpacing:1.5}},"UP TO"),
        CE("select",{value:endMkey,onChange:function(e){setEndMkey(e.target.value);},style:{padding:"5px 10px",borderRadius:6,border:"2px solid #0f172a",background:"#0f172a",color:"#fff",fontWeight:700,fontSize:11,fontFamily:"monospace",cursor:"pointer"}},
          MONTHS.slice().reverse().map(function(m){return CE("option",{key:m.key,value:m.key},m.label);})
        ),
        months.map(function(m,i){var mc=MCOL_SEQ[i%3];return CE("div",{key:m.key,style:{display:"flex",alignItems:"center",gap:4}},CE("div",{style:{width:8,height:8,borderRadius:2,background:mc.bg,border:"1px solid "+mc.col+"44"}}),CE("span",{style:{fontSize:10,color:"#64748b",fontWeight:600,fontFamily:"monospace"}},m.label));})
      )
    ),
    CE("div",{style:{maxWidth:1280,margin:"0 auto",padding:"18px 20px"}},
      CE("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16,flexWrap:"wrap",gap:10}},
        CE(SummaryStrip,{sts:allSts}),
        CE("div",{style:{fontSize:11,color:"#94a3b8"}},CE("span",{style:{fontWeight:700,color:dept.accent}},dept.label),months.length?(" - "+months[0].label+(months.length>1?" to "+months[months.length-1].label:"")):"")
      ),
      dailyKpis.length>0&&CE("div",null,
        CE("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:10}},CE("div",{style:{height:1,flex:1,background:"#e2e8f0"}}),CE("span",{style:{fontSize:9,fontWeight:800,letterSpacing:2,color:"#16a34a",background:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:4,padding:"2px 10px"}},"DAILY KPIs - month-to-date average per month"),CE("div",{style:{height:1,flex:1,background:"#e2e8f0"}})),
        CE("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))",gap:12,marginBottom:20}},
          dailyKpis.map(function(kpi){return CE(KpiCard,{key:kpi.id,kpi:kpi,allEntries:allEntries,dept:dept,months:months});})
        )
      ),
      monthlyKpis.length>0&&CE("div",null,
        CE("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:10}},CE("div",{style:{height:1,flex:1,background:"#e2e8f0"}}),CE("span",{style:{fontSize:9,fontWeight:800,letterSpacing:2,color:"#ea580c",background:"#fff7ed",border:"1px solid #fed7aa",borderRadius:4,padding:"2px 10px"}},"MONTHLY KPIs - last-day-of-month entries"),CE("div",{style:{height:1,flex:1,background:"#e2e8f0"}})),
        CE("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(300px,1fr))",gap:12}},
          monthlyKpis.map(function(kpi){return CE(KpiCard,{key:kpi.id,kpi:kpi,allEntries:allEntries,dept:dept,months:months});})
        )
      )
    )
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(CE(App,null));


  } catch(err) {
    document.getElementById('root').innerHTML = '<div style="padding:40px;font-family:monospace;color:#dc2626;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;margin:40px"><strong>JavaScript Error:</strong><br><br>' + err.message + '<br><br><pre>' + (err.stack||'') + '</pre></div>';
    console.error('Dashboard error:', err);
  }
});
</script>
</body>
</html>
