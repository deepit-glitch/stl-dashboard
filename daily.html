async function loadData(deptId, mk) {
  var isDemo = localStorage.getItem('stl_demo') === 'true';
  var token  = localStorage.getItem('stl_token') || window.STL_TOKEN || '';
  if (isDemo) { try { return JSON.parse(localStorage.getItem('stl:'+deptId+':'+mk))||{}; } catch(e){return{};} }
  try {
    var r = await fetch(WORKER+'/kpidata/'+encodeURIComponent(deptId)+'/'+encodeURIComponent(mk),
      {headers:{'X-Session-Token':token}});
    if (!r.ok) return {};
    var j = await r.json();
    return j.data || {};
  } catch(e) { return {}; }
}

function getStatus(val, t, hib) {
  if (val === "" || val == null || t == null) return "n";
  var v = +val, tgt = +t;
  if (tgt === 0) return !hib ? (v === 0 ? "g" : "b") : "n";
  var r = v / tgt;
  return hib ? (r >= 0.97 ? "g" : r >= 0.9 ? "w" : "b")
             : (r <= 1.03 ? "g" : r <= 1.1 ? "w" : "b");
}

function getIST() {
  var n = new Date(new Date().toLocaleString("en-US", {timeZone:"Asia/Kolkata"}));
  return {y:n.getFullYear(), m:n.getMonth()+1, d:n.getDate()};
}
function getWorkingDate() {
  var ist = getIST();
  var mk = ist.y + "-" + String(ist.m).padStart(2,"0");
  if (MONTHS.find(function(mo){return mo.key===mk;})) return Object.assign({},ist,{mk:mk,isTesting:false});
  return {y:2026,m:4,d:30,mk:"2026-04",isTesting:true};
}
var MN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDate(y,m,d) { return d + " " + MN[m-1] + " " + y; }
function fmt2(n) {
  if (n == null) return "-";
  var v = +n;
  if (isNaN(v)) return String(n);
  return Number.isInteger(v) ? String(v) : parseFloat(v.toFixed(3)).toString();
}

function getMonthValue(kpi, mk, entries) {
  var month = MONTHS.find(function(m){return m.key===mk;}) || MONTHS[0];
  if (kpi.freq === "monthly") {
    var ld = month.days;
    var v = entries[ld] ? entries[ld][kpi.id] : undefined;
    return (v !== undefined && v !== "") ? +v : null;
  }
  var vals = [];
  for (var d=1; d<=month.days; d++) {
    var vd = entries[d] ? entries[d][kpi.id] : undefined;
    if (vd !== undefined && vd !== "") vals.push(+vd);
  }
  return vals.length ? vals.reduce(function(a,b){return a+b;},0)/vals.length : null;
}


// SVG Sparkline component
function Sparkline(props) {
  var dayData = props.dayData;
  var target  = props.target;
  var color   = props.color;
  var H = 90, W = 320, pad = 6;

  var validVals = dayData.filter(function(d){return d.val!==null;}).map(function(d){return d.val;});
  if (validVals.length === 0) {
    return CE("div",{style:{height:H,display:"flex",alignItems:"center",justifyContent:"center"}},
      CE("span",{style:{fontSize:11,color:"#cbd5e1",fontStyle:"italic"}},"No data yet - enter values in the Data Entry app")
    );
  }

  var allV = target!=null ? validVals.concat([+target]) : validVals;
  var minV = Math.min.apply(null,allV), maxV = Math.max.apply(null,allV);
  var rng  = maxV - minV || 1;
  var N    = dayData.length;

  function xp(day) { return pad + (day-1)/(N-1||1)*(W-pad*2); }
  function yp(v)   { return H - pad - (v-minV)/rng*(H-pad*2); }

  // Build segments of non-null consecutive points
  var segs = [], cur = [];
  dayData.forEach(function(d) {
    if (d.val !== null) { cur.push([xp(d.day),yp(d.val)]); }
    else { if(cur.length){segs.push(cur);cur=[];} }
  });
  if(cur.length) segs.push(cur);

  var children = [];

  // Gradient def
  children.push(CE("defs",{key:"defs"},
    CE("linearGradient",{id:"grad_"+props.uid,x1:"0",y1:"0",x2:"0",y2:"1"},
      CE("stop",{offset:"5%",  stopColor:color,stopOpacity:"0.18"}),
      CE("stop",{offset:"95%", stopColor:color,stopOpacity:"0"})
    )
  ));

  // Target line
  if (target != null) {
    var ty = yp(+target).toFixed(1);
    children.push(CE("line",{key:"tgt",x1:pad,y1:ty,x2:W-pad,y2:ty,
      stroke:"#94a3b8",strokeDasharray:"4 3",strokeWidth:1.5}));
    children.push(CE("text",{key:"tgtlbl",x:W-pad+2,y:ty,fontSize:8,fill:"#94a3b8",dominantBaseline:"middle"},
      String(target)));
  }

  // Area + line for each segment
  segs.forEach(function(pts,si) {
    if (pts.length < 2) return;
    var ptsStr = pts.map(function(p){return p[0].toFixed(1)+","+p[1].toFixed(1);}).join(" ");
    var areaPath = "M "+pts[0][0].toFixed(1)+","+H+" L "+ptsStr+" L "+pts[pts.length-1][0].toFixed(1)+","+H+" Z";
    children.push(CE("path",{key:"area"+si,d:areaPath,fill:"url(#grad_"+props.uid+")",stroke:"none"}));
    children.push(CE("polyline",{key:"line"+si,points:ptsStr,fill:"none",stroke:color,strokeWidth:2,strokeLinecap:"round",strokeLinejoin:"round"}));
  });

  // Dots for all valid points
  dayData.forEach(function(d,i) {
    if (d.val===null) return;
    children.push(CE("circle",{key:"dot"+i,cx:xp(d.day).toFixed(1),cy:yp(d.val).toFixed(1),r:3,fill:color,stroke:"#fff",strokeWidth:1.5}));
  });

  return CE("svg",{width:"100%",height:H,viewBox:"0 0 "+W+" "+H,style:{overflow:"visible"}},children);
}

function DailyCard(props) {
  var kpi=props.kpi, mkey=props.mkey, entries=props.entries, dept=props.dept;
  var month = MONTHS.find(function(m){return m.key===mkey;})||MONTHS[0];
  var target = kpi.targets[mkey];

  var dayData = [];
  for(var d=1;d<=month.days;d++){
    var v=entries[d]?entries[d][kpi.id]:undefined;
    dayData.push({day:d,val:(v!==undefined&&v!=="")?+v:null});
  }
  var validVals=dayData.filter(function(d){return d.val!==null;}).map(function(d){return d.val;});
  var latest=null;
  for(var i=dayData.length-1;i>=0;i--){if(dayData[i].val!==null){latest=dayData[i].val;break;}}
  var avg=validVals.length?validVals.reduce(function(a,b){return a+b;},0)/validVals.length:null;
  var st=getStatus(latest,target,kpi.hib);

  return CE("div",{style:{background:"#fff",borderRadius:14,padding:"16px 16px 12px",
    border:"1.5px solid "+(latest!==null?SC[st]+"44":"#e2e8f0"),
    boxShadow:"0 1px 6px rgba(0,0,0,0.06)"}},
    CE("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}},
      CE("div",{style:{flex:1,paddingRight:8}},

        CE("div",{style:{display:"flex",gap:5,marginTop:4,alignItems:"center",flexWrap:"wrap"}},
          CE("span",{style:{fontSize:9,fontWeight:700,fontFamily:"monospace",color:"#fff",background:dept.accent,padding:"1px 6px",borderRadius:3}},kpi.unit),
          CE("span",{style:{fontSize:9,color:kpi.hib?"#16a34a":"#f97316",fontWeight:600}},kpi.hib?"Higher is better":"Lower is better"),
          validVals.length>0&&CE("span",{style:{fontSize:9,color:"#94a3b8"}},validVals.length+" entries")
        )
      ),
      CE("div",{style:{textAlign:"right",flexShrink:0}},
        CE("div",{style:{display:"flex",alignItems:"center",gap:5,justifyContent:"flex-end"}},
          CE("div",{style:{width:8,height:8,borderRadius:"50%",background:latest!==null?SC[st]:"#e2e8f0",boxShadow:latest!==null?"0 0 6px "+SC[st]:"none"}}),
          CE("span",{style:{fontSize:22,fontWeight:900,color:latest!==null?SC[st]:"#e2e8f0",fontFamily:"monospace"}},latest!==null?fmt2(latest):"-")
        ),
        target!=null&&CE("div",{style:{fontSize:9,color:"#94a3b8",marginTop:1,fontFamily:"monospace"}},"Target: "+target),
        avg!==null&&CE("div",{style:{fontSize:9,color:"#64748b",fontFamily:"monospace"}},"Avg: "+fmt2(avg)),
        latest!==null&&CE("div",{style:{fontSize:9,fontWeight:700,color:SC[st],marginTop:1}},SLB[st])
      )
    ),
    CE(Sparkline,{dayData:dayData,target:target,color:latest!==null?SC[st]:"#e2e8f0",uid:kpi.id})
  );
}

function MonthlyCard(props) {
  var kpi=props.kpi, mkey=props.mkey, entries=props.entries, dept=props.dept;
  var month=MONTHS.find(function(m){return m.key===mkey;})||MONTHS[0];
  var target=kpi.targets[mkey];
  var raw=entries[month.days]?entries[month.days][kpi.id]:undefined;
  var val=(raw!==undefined&&raw!=="")?+raw:null;
  var st=getStatus(val,target,kpi.hib);
  var pct=(val!==null&&target!=null&&+target!==0)?Math.min(100,kpi.hib?val/target*100:target/val*100):0;

  return CE("div",{style:{background:"#fff",borderRadius:14,padding:16,
    border:"1.5px solid "+(val!==null?SC[st]+"44":"#e2e8f0"),
    boxShadow:"0 1px 6px rgba(0,0,0,0.06)"}},
    CE("div",{style:{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:8}},
      CE("div",{style:{flex:1,paddingRight:8}},
        CE("div",{style:{fontSize:12,fontWeight:700,color:"#1e293b",lineHeight:1.3}},kpi.name),
        CE("div",{style:{display:"flex",gap:5,marginTop:4,flexWrap:"wrap",alignItems:"center"}},
          CE("span",{style:{fontSize:9,fontWeight:700,fontFamily:"monospace",color:"#fff",background:dept.accent,padding:"1px 6px",borderRadius:3}},kpi.unit),
          CE("span",{style:{fontSize:9,fontWeight:700,color:"#ea580c",background:"#fff7ed",padding:"1px 6px",borderRadius:3,border:"1px solid #fed7aa"}},"Monthly"),
          CE("span",{style:{fontSize:9,color:kpi.hib?"#16a34a":"#f97316",fontWeight:600}},kpi.hib?"Higher":"Lower")
        )
      ),
      CE("div",{style:{textAlign:"right"}},
        CE("div",{style:{fontSize:22,fontWeight:900,color:val!==null?SC[st]:"#e2e8f0",fontFamily:"monospace"}},val!==null?fmt2(val):"-"),
        target!=null&&CE("div",{style:{fontSize:9,color:"#94a3b8",fontFamily:"monospace"}},"Target: "+target)
      )
    ),
    val!==null&&target!=null&&CE("div",null,
      CE("div",{style:{height:4,background:"#f1f5f9",borderRadius:2,overflow:"hidden",marginBottom:3}},
        CE("div",{style:{height:"100%",borderRadius:2,background:SC[st],width:pct+"%",transition:"width 0.5s"}})
      ),
      CE("div",{style:{fontSize:9,color:SC[st],fontWeight:700}},SLB[st]+" - "+fmt2(pct)+"% of target")
    ),
    val===null&&CE("div",{style:{fontSize:10,color:"#cbd5e1",fontStyle:"italic",marginTop:4}},"Entered on last day of month")
  );
}

function SummaryStrip(props) {
  var sts=props.sts;
  var cnt=function(s){return sts.filter(function(x){return x===s;}).length;};
  return CE("div",{style:{display:"flex",gap:8,flexWrap:"wrap"}},
    [["g","On Target"],["w","Close"],["b","Off Target"],["n","No Data"]].map(function(pair){
      var s=pair[0],lbl=pair[1];
      return CE("div",{key:s,style:{display:"flex",alignItems:"center",gap:6,padding:"5px 12px",
        background:SBG[s],border:"1.5px solid "+SC[s]+"44",borderRadius:8}},
        CE("span",{style:{fontSize:17,fontWeight:900,color:SC[s],fontFamily:"monospace"}},cnt(s)),
        CE("div",null,
          CE("div",{style:{fontSize:8,fontWeight:700,color:SC[s],letterSpacing:1,textTransform:"uppercase"}},lbl),
          CE("div",{style:{fontSize:9,color:"#64748b"}},"KPIs")
        )
      );
    })
  );
}

function doLogout() {
  var isDemo = localStorage.getItem('stl_demo') === 'true';
  var token  = localStorage.getItem('stl_token') || window.STL_TOKEN || '';
  ['stl_token','stl_role','stl_name','stl_dept','stl_demo'].forEach(function(k){localStorage.removeItem(k);});
  if (token && !isDemo) {
    fetch('https://square-flower-57b5.deepit.workers.dev/auth/logout', {method:'POST', headers:{'X-Session-Token':token}}).catch(function(){});
  }
  window.location.href = isDemo ? 'demo_login.html' : 'login.html';
}

function App() {
  var wd=getWorkingDate();
  var sdi=useState("Weaving"), selDeptId=sdi[0], setSelDeptId=sdi[1];
  var smk=useState(wd.mk),     selMkey=smk[0],   setSelMkey=smk[1];
  var se=useState({}),         entries=se[0],    setEntries=se[1];
  var st=useState(0),          tick=st[0],       setTick=st[1];

  var dept  = DEPTS.find(function(d){return d.id===selDeptId;})||DEPTS[0];
  var month = MONTHS.find(function(m){return m.key===selMkey;})||MONTHS[0];

  useEffect(function(){
    loadData(selDeptId, selMkey).then(function(data){ setEntries(data); });
  },[selDeptId,selMkey,tick]);
  useEffect(function(){
    var t=setInterval(function(){setTick(function(n){return n+1;});},60000);
    return function(){clearInterval(t);};
  },[]);

  var dailyKpis   = dept.kpis.filter(function(k){return k.freq==="daily";});
  var monthlyKpis = dept.kpis.filter(function(k){return k.freq==="monthly";});

  var allSts=dept.kpis.map(function(kpi){
    if(kpi.freq==="monthly"){var v=entries[month.days]?entries[month.days][kpi.id]:undefined;return getStatus(v!==undefined&&v!==""?+v:null,kpi.targets[selMkey],kpi.hib);}
    var lv=null;for(var d=month.days;d>=1;d--){var vd=entries[d]?entries[d][kpi.id]:undefined;if(vd!==undefined&&vd!==""){lv=+vd;break;}}
    return getStatus(lv,kpi.targets[selMkey],kpi.hib);
  });

  return CE("div",{style:{minHeight:"100vh",background:"#f0f4f8"}},
    // Header
    CE("div",{style:{background:"#0f172a",padding:"0 20px",height:56,display:"flex",alignItems:"center",justifyContent:"space-between",borderBottom:"3px solid "+dept.accent}},
      CE("div",{style:{display:"flex",alignItems:"center",gap:10}},
        CE("div",{style:{width:30,height:30,borderRadius:8,background:dept.accent+"1a",display:"flex",alignItems:"center",justifyContent:"center",border:"1px solid "+dept.accent+"44"}},
          CE("span",{style:{fontFamily:"monospace",fontSize:12,fontWeight:800,color:dept.accent}},"S")
        ),
        CE("div",{style:{fontFamily:"monospace",fontSize:12,fontWeight:700,color:dept.accent,letterSpacing:2}},"STL"),
        CE("div",{style:{width:1,height:16,background:"#334155"}}),
        CE("div",{style:{fontSize:13,fontWeight:600,color:"#e2e8f0"}},"Daily Dashboard"),
        wd.isTesting&&CE("div",{style:{padding:"2px 8px",background:"#713f12",borderRadius:4,fontSize:9,fontWeight:700,color:"#fef08a",letterSpacing:1}},"TEST MODE")
      ),
      CE("div",{style:{display:"flex",alignItems:"center",gap:8}},
        CE("div",{style:{fontSize:11,color:"#64748b",fontFamily:"monospace"}},fmtDate(wd.y,wd.m,wd.d)),
        CE("button",{onClick:function(){setTick(function(n){return n+1;});},style:{padding:"4px 12px",borderRadius:6,border:"1px solid #334155",background:"transparent",color:"#94a3b8",cursor:"pointer",fontSize:11,fontWeight:600}},"Refresh"),
        CE("button",{onClick:doLogout,style:{padding:"4px 12px",borderRadius:6,border:"1px solid #334155",background:"transparent",color:"#94a3b8",cursor:"pointer",fontSize:11,fontWeight:600}},"Logout")
      )
    ),
    // Filter bar
    CE("div",{style:{background:"#fff",borderBottom:"1px solid #e2e8f0",padding:"9px 20px",display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}},
      CE("span",{style:{fontSize:9,fontWeight:700,color:"#94a3b8",letterSpacing:1.5,marginRight:2}},"DEPT"),
      DEPTS.map(function(d){return CE("button",{key:d.id,onClick:function(){setSelDeptId(d.id);},style:{padding:"4px 13px",borderRadius:20,cursor:"pointer",fontWeight:600,fontSize:11,border:"2px solid "+(d.id===selDeptId?d.accent:"#f1f5f9"),background:d.id===selDeptId?d.accent:"#f8fafc",color:d.id===selDeptId?"#fff":"#64748b",transition:"all 0.15s"}},d.label);}),
      CE("div",{style:{marginLeft:"auto",display:"flex",gap:6}},
        MONTHS.map(function(m){return CE("button",{key:m.key,onClick:function(){setSelMkey(m.key);},style:{padding:"4px 14px",borderRadius:6,cursor:"pointer",fontWeight:700,fontSize:11,fontFamily:"monospace",border:"2px solid "+(m.key===selMkey?"#0f172a":"#f1f5f9"),background:m.key===selMkey?"#0f172a":"#f8fafc",color:m.key===selMkey?"#fff":"#64748b",transition:"all 0.15s"}},m.short);})
      )
    ),
    // Content
    CE("div",{style:{maxWidth:1280,margin:"0 auto",padding:"18px 20px"}},
      CE("div",{style:{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16,flexWrap:"wrap",gap:10}},
        CE(SummaryStrip,{sts:allSts}),
        CE("div",{style:{fontSize:11,color:"#94a3b8"}},CE("span",{style:{fontWeight:700,color:dept.accent}},dept.label)," - "+month.label+" - auto-refreshes every 60s")
      ),
      dailyKpis.length>0&&CE("div",null,
        CE("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:10}},
          CE("div",{style:{height:1,flex:1,background:"#e2e8f0"}}),
          CE("span",{style:{fontSize:9,fontWeight:800,letterSpacing:2,color:"#16a34a",background:"#f0fdf4",border:"1px solid #bbf7d0",borderRadius:4,padding:"2px 10px"}},"DAILY KPIs - trend by day"),
          CE("div",{style:{height:1,flex:1,background:"#e2e8f0"}})
        ),
        CE("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(320px,1fr))",gap:12,marginBottom:20}},
          dailyKpis.map(function(kpi){return CE(DailyCard,{key:kpi.id,kpi:kpi,mkey:selMkey,entries:entries,dept:dept});})
        )
      ),
      monthlyKpis.length>0&&CE("div",null,
        CE("div",{style:{display:"flex",alignItems:"center",gap:8,marginBottom:10}},
          CE("div",{style:{height:1,flex:1,background:"#e2e8f0"}}),
          CE("span",{style:{fontSize:9,fontWeight:800,letterSpacing:2,color:"#ea580c",background:"#fff7ed",border:"1px solid #fed7aa",borderRadius:4,padding:"2px 10px"}},"MONTHLY KPIs - last day of month"),
          CE("div",{style:{height:1,flex:1,background:"#e2e8f0"}})
        ),
        CE("div",{style:{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:12}},
          monthlyKpis.map(function(kpi){return CE(MonthlyCard,{key:kpi.id,kpi:kpi,mkey:selMkey,entries:entries,dept:dept});})
        )
      )
    )
  );
}
ReactDOM.createRoot(document.getElementById("root")).render(CE(App,null));


  } catch(err) {
    document.getElementById('root').innerHTML = '<div style="padding:40px;font-family:monospace;color:#dc2626;background:#fef2f2;border:1px solid #fecaca;border-radius:8px;margin:40px"><strong>JavaScript Error:</strong><br><br>' + err.message + '<br><br><pre>' + (err.stack||'') + '</pre></div>';
    console.error('Dashboard error:', err);
  }
});
</script>
</body>
