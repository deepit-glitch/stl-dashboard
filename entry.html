const DEF_PINS = {
  admin:"0000", RSB:"1234", Weaving:"1234", Dyeing:"1234",
  Finishing:"1234", Prep:"1234", UB:"1234", PPC:"1234",
  Bathrobe:"1234", Quality:"1234"
};
const PINS_KEY = "stl:pins:v4";
const dk = (d,mk) => "stl:" + d + ":" + mk;

function loadPins()  { try { return JSON.parse(localStorage.getItem(PINS_KEY)) || {...DEF_PINS}; } catch(e) { return {...DEF_PINS}; } }
function savePins(p) { try { localStorage.setItem(PINS_KEY, JSON.stringify(p)); return true; } catch(e) { return false; } }
function loadData(d,mk)       { try { return JSON.parse(localStorage.getItem(dk(d,mk))) || {}; } catch(e) { return {}; } }
function saveData(d,mk,data)  { try { localStorage.setItem(dk(d,mk), JSON.stringify(data)); return true; } catch(e) { return false; } }

function getIST() {
  const n = new Date(new Date().toLocaleString("en-US", {timeZone:"Asia/Kolkata"}));
  return {y:n.getFullYear(), m:n.getMonth()+1, d:n.getDate()};
}
function getWorkingDate() {
  const ist = getIST();
  const mk = ist.y + "-" + String(ist.m).padStart(2,"0");
  // Allow previous day entry if current IST time is before 12:00 noon
  const allowPrevDay = ist.hour < 12;
  // Calculate yesterday (handles month boundaries)
  let prevD = ist.d - 1, prevM = ist.m, prevY = ist.y;
  if (prevD < 1) {
    prevM -= 1;
    if (prevM < 1) { prevM = 12; prevY -= 1; }
    prevD = new Date(prevY, prevM, 0).getDate(); // last day of prev month
  }
  const prevMk = prevY + "-" + String(prevM).padStart(2,"0");
  const prevInfo = { d: prevD, m: prevM, y: prevY, mk: prevMk };
  if (MONTHS.find(mo => mo.key === mk)) return {...ist, mk, isTesting:false, allowPrevDay, prevInfo};
  return {y:2026, m:4, d:30, mk:"2026-04", isTesting:true, allowPrevDay:false, prevInfo:null};
}
function isLastDayOfMonth(y,m,d) { return new Date(y,m,0).getDate() === d; }

const MN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function fmtDate(y,m,d) { return d + " " + MN[m-1] + " " + y; }

function getStatus(val, t, hib) {
  if (val === "" || val == null || t == null) return "n";
  const v = +val, tgt = +t;
  if (tgt === 0) return !hib ? (v === 0 ? "g" : "b") : "n";
  const r = v / tgt;
  return hib ? (r >= 0.97 ? "g" : r >= 0.9 ? "w" : "b")
             : (r <= 1.03 ? "g" : r <= 1.1 ? "w" : "b");
}
const SC  = {g:"#16a34a", w:"#ca8a04", b:"#dc2626", n:"#94a3b8"};
const SBG = {g:"#f0fdf4", w:"#fefce8", b:"#fef2f2", n:"#f8fafc"};
const SLB = {g:"On Target", w:"Close", b:"Off Target", n:"-"};

// -- PIN PAD -----------------------------------------------------
function PinPad({value, onChange, onSubmit, accent}) {
  const KEYS = [1,2,3,4,5,6,7,8,9,"CLR",0,"OK"];
  function press(k) {
    if (k === "OK")  { if (value.length === 4) onSubmit(); return; }
    if (k === "CLR") { onChange(""); return; }
    if (value.length < 4) onChange(value + String(k));
  }
  return (
    <div style={{userSelect:"none"}}>
      <div style={{display:"flex", justifyContent:"center", gap:16, marginBottom:24}}>
        {[0,1,2,3].map(i => (
          <div key={i} style={{width:13, height:13, borderRadius:"50%",
            background: i < value.length ? (accent||"#6366f1") : "#e2e8f0",
            transition:"background 0.15s",
            boxShadow: i < value.length ? ("0 0 8px " + (accent||"#6366f1") + "66") : "none"}}/>
        ))}
      </div>
      <div style={{display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:9, maxWidth:220, margin:"0 auto"}}>
        {KEYS.map((k,i) => {
          const isOK = k==="OK", isCLR = k==="CLR", dis = isOK && value.length !== 4;
          return (
            <button key={i} onClick={() => press(k)} disabled={dis} style={{
              padding:"17px 0", borderRadius:13, fontWeight:700, fontSize:18, fontFamily:"monospace",
              border: isOK ? ("2px solid " + (dis ? "#e2e8f0" : (accent||"#6366f1"))) : "1.5px solid #f1f5f9",
              background: isOK ? (dis ? "#f8fafc" : (accent||"#6366f1")) : isCLR ? "#fef2f2" : "#fff",
              color: isOK ? (dis ? "#cbd5e1" : "#fff") : isCLR ? "#ef4444" : "#1e293b",
              cursor: dis ? "not-allowed" : "pointer",
              boxShadow:"0 1px 4px rgba(0,0,0,0.08)"
            }}>{k}</button>
          );
        })}
      </div>
    </div>
  );
}

// -- KPI ROW ------------------------------------------------------
function KpiRow({kpi, mkey, value, onChange, locked, accent}) {
  const t   = kpi.targets[mkey];
  const val = value == null ? "" : value;
  const st  = getStatus(val, t, kpi.hib);
  const fld = val !== "";

  return (
    <div style={{
      borderRadius:12,
      border: "1.5px solid " + (locked ? "#f1f5f9" : fld ? SC[st] + "55" : "#e8edf2"),
      background: locked ? "#f9fafb" : fld ? SBG[st] : "#fff",
      transition:"all 0.18s", overflow:"hidden"
    }}>
      <div style={{display:"flex", alignItems:"center", gap:10, padding:"12px 14px 6px"}}>
        <div style={{width:3, height:40, borderRadius:2, flexShrink:0,
          background: locked ? "#e2e8f0" : fld ? SC[st] : accent,
          transition:"background 0.2s"}}/>
        <div style={{flex:1, minWidth:0}}>
          <div style={{fontSize:13, fontWeight:700, color: locked ? "#94a3b8" : "#1e293b",
            whiteSpace:"nowrap", overflow:"hidden", textOverflow:"ellipsis"}}>{kpi.name}</div>
          <div style={{display:"flex", alignItems:"center", gap:6, marginTop:3, flexWrap:"wrap"}}>
            <span style={{fontSize:10, fontWeight:700, fontFamily:"monospace",
              color:"#fff", background: locked ? "#94a3b8" : accent,
              padding:"1px 7px", borderRadius:4}}>{kpi.unit}</span>
            <span style={{fontSize:10, fontWeight:600,
              color: kpi.hib ? "#16a34a" : "#f97316"}}>
              {kpi.hib ? "Higher is better" : "Lower is better"}
            </span>
            {t != null && (
              <span style={{fontSize:10, color:"#94a3b8"}}>
                Target: <span style={{fontFamily:"monospace", fontWeight:700, color:"#475569"}}>{t}</span>
              </span>
            )}
          </div>
        </div>
        <div style={{display:"flex", alignItems:"center", gap:8, flexShrink:0}}>
          {fld && !locked && (
            <span style={{fontSize:9, fontFamily:"monospace", fontWeight:700,
              color:SC[st], background:SBG[st], border:"1px solid " + SC[st] + "44",
              padding:"3px 8px", borderRadius:5, whiteSpace:"nowrap"}}>{SLB[st]}</span>
          )}

            <span style={{fontSize:9, fontFamily:"monospace", fontWeight:700,
              color:"#ea580c", background:"#fff7ed", border:"1px solid #fed7aa",
              padding:"3px 8px", borderRadius:5, whiteSpace:"nowrap"}}>Last day only</span>
          )}

            type="number" step="any" value={val} placeholder="-"
            disabled={locked}
            onChange={e => !locked && onChange(kpi.id, e.target.value)}
            style={{
              width:96, padding:"9px 10px", borderRadius:8,
              fontFamily:"monospace", fontSize:15, fontWeight:800, textAlign:"right",
              border: "2px solid " + (locked ? "#e2e8f0" : fld ? SC[st] : "#e2e8f0"),
              outline:"none",
              color: locked ? "#cbd5e1" : fld ? SC[st] : "#94a3b8",
              background: locked ? "#f8fafc" : "#fff",
              transition:"all 0.18s", cursor: locked ? "not-allowed" : "text"
            }}/>
        </div>
      </div>
      <div style={{padding:"0 14px 10px 29px"}}>
        <p style={{fontSize:11, color:"#94a3b8", lineHeight:1.5, fontStyle:"italic"}}>{kpi.desc}</p>

}

// -- KPI FORM -----------------------------------------------------
function KpiForm({dept, inputs, onChange, mkey, isAdmin, onSave, saving, flash, lockedMonthly}) {
  const dailyKpis   = dept.kpis.filter(k => k.freq === D);
  const monthlyKpis = dept.kpis.filter(k => k.freq === M);
  const canFillMonthly = !lockedMonthly || isAdmin;

  const totalFillable = dailyKpis.length + (canFillMonthly ? monthlyKpis.length : 0);
  const totalFilled = dept.kpis.filter(k => {
    if (k.freq === M && !canFillMonthly) return false;
    return inputs[k.id] !== undefined && inputs[k.id] !== "";
  }).length;
  const onTgt = dept.kpis.filter(k => getStatus(inputs[k.id], k.targets[mkey], k.hib) === "g").length;
  const pct = totalFillable > 0 ? Math.round(totalFilled / totalFillable * 100) : 0;

  function SectionDivider({label, color, bg, border}) {
    return (
      <div style={{display:"flex", alignItems:"center", gap:8, margin:"4px 0 8px"}}>
        <div style={{height:1, flex:1, background:"#f1f5f9"}}/>
        <span style={{fontSize:9, fontWeight:800, letterSpacing:2, textTransform:"uppercase",
          color, background:bg, border:"1px solid " + border,
          borderRadius:4, padding:"2px 10px", whiteSpace:"nowrap"}}>{label}</span>
        <div style={{height:1, flex:1, background:"#f1f5f9"}}/>
      </div>
    );
  }

  return (
    <div style={{background:"#fff", borderRadius:14, padding:18, border:"1px solid #e2e8f0", boxShadow:"0 1px 5px rgba(0,0,0,0.05)"}}>
      <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:16, gap:10, flexWrap:"wrap"}}>
        <div style={{flex:1, minWidth:180}}>
          <div style={{display:"flex", alignItems:"center", gap:10, marginBottom:5}}>
            <div style={{flex:1, height:5, background:"#f1f5f9", borderRadius:3, overflow:"hidden"}}>
              <div style={{height:"100%", borderRadius:3, background:dept.accent, width:pct + "%", transition:"width 0.4s ease"}}/>
            </div>
            <span style={{fontSize:11, fontFamily:"monospace", fontWeight:700, color:dept.accent, minWidth:32}}>{pct}%</span>
          </div>
          <div style={{fontSize:11, color:"#94a3b8"}}>
            <span style={{fontWeight:700, color:"#475569"}}>{totalFilled}</span>/{totalFillable} KPIs filled
            {totalFilled > 0 && <span style={{marginLeft:8, color:SC.g, fontWeight:700}}>- {onTgt} on target</span>}
          </div>
        </div>
        <button onClick={onSave} disabled={saving} style={{
          padding:"10px 28px", borderRadius:9, border:"none", cursor:"pointer",
          fontWeight:700, fontSize:13, minWidth:136,
          background: flash === "ok" ? SC.g : flash === "err" ? SC.b : dept.accent,
          color:"#fff", transition:"background 0.25s",
          boxShadow:"0 2px 10px " + dept.accent + "44"
        }}>
          {saving ? "Saving..." : flash === "ok" ? "Saved!" : flash === "err" ? "Error" : "Save Entry"}
        </button>
      </div>

      {dailyKpis.length > 0 && (
        <>
          <SectionDivider label="DAILY ENTRY - enter every working day" color="#16a34a" bg="#f0fdf4" border="#bbf7d0"/>
          <div style={{display:"flex", flexDirection:"column", gap:8, marginBottom:14}}>
            {dailyKpis.map(kpi => (
              <KpiRow key={kpi.id} kpi={kpi} mkey={mkey} value={inputs[kpi.id]} onChange={onChange} locked={false} accent={dept.accent}/>
            ))}
          </div>
        </>
      )}

      {monthlyKpis.length > 0 && (
        <>
          <SectionDivider
            label={canFillMonthly ? "MONTHLY ENTRY - last day of month" : "MONTHLY ENTRY - locked (due last day of month)"}
            color="#ea580c" bg="#fff7ed" border="#fed7aa"/>
          <div style={{display:"flex", flexDirection:"column", gap:8}}>
            {monthlyKpis.map(kpi => (
              <KpiRow key={kpi.id} kpi={kpi} mkey={mkey} value={inputs[kpi.id]} onChange={onChange} locked={!canFillMonthly} accent={dept.accent}/>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

// -- NORMAL USER ENTRY SCREEN -------------------------------------
function EntryScreen({dept, onLogout}) {
  const wd = getWorkingDate();
  // viewingPrev: true = user switched to entering for yesterday
  const [viewingPrev, setViewingPrev] = useState(false);

  // Active day context — switches between today and yesterday
  const activeDay  = viewingPrev ? wd.prevInfo.d  : wd.d;
  const activeMk   = viewingPrev ? wd.prevInfo.mk : wd.mk;
  const activeY    = viewingPrev ? wd.prevInfo.y  : wd.y;
  const activeM    = viewingPrev ? wd.prevInfo.m  : wd.m;
  const month      = MONTHS.find(m => m.key === activeMk) || MONTHS[0];
  const isLast     = isLastDayOfMonth(activeY, activeM, activeDay);

  const [entries, setEntries] = useState({});
  const [inputs,  setInputs]  = useState({});
  const [saving,  setSaving]  = useState(false);
  const [flash,   setFlash]   = useState(null);

  // Reload when switching between today/yesterday
  useEffect(() => {
    const data = loadData(dept.id, activeMk);
    setEntries(data);
    setInputs(data[activeDay] || {});
  }, [dept.id, activeMk, activeDay]);

  function handleChange(id, val) { setInputs(p => ({...p, [id]:val})); }
  function handleSave() {
    setSaving(true);
    const upd = {...entries, [activeDay]: {...inputs}};
    const ok = saveData(dept.id, activeMk, upd);
    setEntries(upd); setSaving(false);
    setFlash(ok ? "ok" : "err");
    setTimeout(() => setFlash(null), 2200);

  const dc = dept.kpis.filter(k => k.freq === D).length;
  const mc = dept.kpis.filter(k => k.freq === M).length;
  const fd = dept.kpis.filter(k => k.freq === D && inputs[k.id] !== undefined && inputs[k.id] !== "").length;
  const fm = dept.kpis.filter(k => k.freq === M && inputs[k.id] !== undefined && inputs[k.id] !== "").length;
  const tf = dc + (isLast ? mc : 0);
  const fi = fd + (isLast ? fm : 0);
  const pct = tf > 0 ? Math.round(fi / tf * 100) : 0;

  return (
    <div style={{minHeight:"100vh", background:"#eef2f7"}}>

            </svg>
            <div style={{fontSize:9, color:"#94a3b8", marginTop:2, fontFamily:"monospace"}}>{fi}/{tf}</div>
          </div>
        </div>

        <div style={{display:"flex", gap:7, marginBottom:14, flexWrap:"wrap"}}>
          {MONTHS.map(mm => (
            <div key={mm.key} style={{
              padding:"4px 14px", borderRadius:6,
              fontFamily:"monospace", fontSize:11, fontWeight:700,
              background: mm.key === month.key ? "#0f172a" : "transparent",
              color: mm.key === month.key ? "#fff" : "#94a3b8",
              border: "1.5px solid " + (mm.key === month.key ? "#0f172a" : "#e2e8f0"),
              opacity: mm.key === month.key ? 1 : 0.4
            }}>{mm.short}</div>
          ))}
        </div>

        <KpiForm dept={dept} inputs={inputs} onChange={handleChange} mkey={month.key}
          isAdmin={false} onSave={handleSave} saving={saving} flash={flash} lockedMonthly={!isLast}/>
      </div>
    </div>
  );
}

// -- PIN MANAGEMENT ------------------------------------------------
function PinManagement({pins, onSavePins, onBack}) {
  const allKeys = [...DEPTS.map(d => ({id:d.id, label:d.label, accent:d.accent})), {id:"admin", label:"Admin", accent:"#4f46e5"}];
  const [local,   setLocal]   = useState({...pins});
  const [editing, setEditing] = useState(null);
  const [newPin,  setNewPin]  = useState("");
  const [showPin, setShowPin] = useState({});
  const [flash,   setFlash]   = useState(null);
  const inputRef = useRef(null);

  function startEdit(id) { setEditing(id); setNewPin(""); setTimeout(() => inputRef.current && inputRef.current.focus(), 50); }
  function confirmEdit() {
    if (newPin.length !== 4) return;
    const upd = {...local, [editing]:newPin};
    setLocal(upd); setEditing(null); setNewPin("");
    const ok = onSavePins(upd);
    setFlash(ok ? "ok" : "err");
    setTimeout(() => setFlash(null), 2500);
  }

  return (
    <div>
      <div style={{display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:18}}>
        <div>
          <div style={{fontSize:17, fontWeight:700, color:"#0f172a"}}>PIN Management</div>
          <div style={{fontSize:12, color:"#94a3b8", marginTop:2}}>Update department and admin PINs</div>
        </div>
        <button onClick={onBack} style={{padding:"7px 16px", borderRadius:8, border:"1.5px solid #e2e8f0", background:"#fff", color:"#64748b", cursor:"pointer", fontSize:12, fontWeight:600}}>Back</button>
      </div>

      {flash && (
        <div style={{padding:"9px 14px", borderRadius:8, marginBottom:14, fontSize:12, fontWeight:700,
          background: flash === "ok" ? "#f0fdf4" : "#fef2f2",
          color: flash === "ok" ? SC.g : SC.b,
          border: "1px solid " + (flash === "ok" ? "#bbf7d0" : "#fecaca")}}>
          {flash === "ok" ? "PIN updated successfully" : "Save failed - please try again"}
        </div>
      )}

      <div style={{display:"flex", flexDirection:"column", gap:8}}>
        {allKeys.map(dep => {
          const isEd = editing === dep.id, shown = showPin[dep.id];
          return (
            <div key={dep.id} style={{background:"#fff", borderRadius:12, padding:"14px 16px",
              border: "1.5px solid " + (isEd ? dep.accent : "#e2e8f0"),
              transition:"border-color 0.2s", boxShadow:"0 1px 4px rgba(0,0,0,0.04)"}}>
              <div style={{display:"flex", alignItems:"center", gap:12, flexWrap:"wrap"}}>
                <div style={{width:10, height:10, borderRadius:"50%", background:dep.accent, flexShrink:0}}/>
                <div style={{flex:1, minWidth:100}}>
                  <div style={{fontSize:13, fontWeight:700, color:"#0f172a"}}>{dep.label}</div>
                  {!isEd && (
                    <div style={{fontSize:11, color:"#94a3b8", marginTop:2, fontFamily:"monospace", display:"flex", alignItems:"center", gap:6}}>
                      PIN: {shown ? local[dep.id] : "...."}
                      <button onClick={() => setShowPin(p => ({...p, [dep.id]:!p[dep.id]}))}
                        style={{background:"none", border:"none", cursor:"pointer", color:dep.accent, fontSize:10, fontWeight:700, padding:0}}>
                        {shown ? "hide" : "show"}
                      </button>
                    </div>
                  )}
                </div>
                {!isEd ? (
                  <button onClick={() => startEdit(dep.id)} style={{padding:"6px 16px", borderRadius:7, border:"1.5px solid " + dep.accent, background:"transparent", color:dep.accent, cursor:"pointer", fontSize:12, fontWeight:700, flexShrink:0}}>Change PIN</button>
                ) : (
                  <div style={{display:"flex", alignItems:"center", gap:8, flexWrap:"wrap"}}>
                    <input ref={inputRef} type="text" maxLength={4} value={newPin}
                      onChange={e => setNewPin(e.target.value.replace(/\D/g,"").slice(0,4))}
                      onKeyDown={e => e.key === "Enter" && confirmEdit()}
                      placeholder="0000"
                      style={{width:100, padding:"7px 12px", borderRadius:7, fontFamily:"monospace", fontSize:18, fontWeight:700, textAlign:"center", letterSpacing:10, border:"2px solid " + dep.accent, outline:"none", color:"#0f172a"}}/>
                    <button onClick={confirmEdit} disabled={newPin.length !== 4}
                      style={{padding:"7px 16px", borderRadius:7, border:"none", cursor:"pointer", fontWeight:700, fontSize:12,
                        background: newPin.length === 4 ? dep.accent : "#f1f5f9",
                        color: newPin.length === 4 ? "#fff" : "#cbd5e1"}}>Save</button>
                    <button onClick={() => { setEditing(null); setNewPin(""); }}
                      style={{padding:"7px 12px", borderRadius:7, border:"1.5px solid #e2e8f0", background:"#fff", color:"#64748b", cursor:"pointer", fontSize:12}}>Cancel</button>
                  </div>
                )}
              </div>
            </div>
          );
        })}
      </div>
      <div style={{marginTop:14, padding:"11px 14px", background:"#f8fafc", borderRadius:9, border:"1px solid #e2e8f0", fontSize:11, color:"#94a3b8", lineHeight:1.7}}>
        Default PINs: departments = <span style={{fontFamily:"monospace", fontWeight:700, color:"#475569"}}>1234</span> - admin = <span style={{fontFamily:"monospace", fontWeight:700, color:"#475569"}}>0000</span>. Change all before going live.
      </div>
    </div>
  );
}

// -- ADMIN SCREEN --------------------------------------------------
function AdminScreen({pins, onUpdatePins, onLogout}) {
  const wd = getWorkingDate();
  const defM = MONTHS.find(m => m.key === wd.mk) || MONTHS[0];
  const [selDept,  setSelDept]  = useState(DEPTS[0]);
  const [selMonth, setSelMonth] = useState(defM);
  const [selDay,   setSelDay]   = useState(wd.d);
  const [entries,  setEntries]  = useState({});
  const [inputs,   setInputs]   = useState({});
  const [saving,   setSaving]   = useState(false);
  const [flash,    setFlash]    = useState(null);

  const isToday = selMonth.key === wd.mk && selDay === wd.d;
  const isPast  = !isToday;

  useEffect(() => {
    const data = loadData(selDept.id, selMonth.key);
    setEntries(data); setInputs(data[selDay] || {});
  }, [selDept, selMonth]);

  useEffect(() => { setInputs(entries[selDay] || {}); }, [selDay]);

  function handleChange(id, val) { setInputs(p => ({...p, [id]:val})); }
  function handleSave() {
    setSaving(true);
    const upd = {...entries, [selDay]: {...inputs}};
    const ok = saveData(selDept.id, selMonth.key, upd);
    setEntries(upd); setSaving(false);
    setFlash(ok ? "ok" : "err");
    setTimeout(() => setFlash(null), 2200);
  }

  const [my, mm] = selMonth.key.split("-").map(Number);

  return (
    <div style={{minHeight:"100vh", background:"#eef2f7"}}>
      <div style={{background:"#0f172a", padding:"0 18px", height:56, display:"flex", alignItems:"center", justifyContent:"space-between", borderBottom:"3px solid #4f46e5"}}>
        <div style={{display:"flex", alignItems:"center", gap:10}}>
          <div style={{width:30, height:30, borderRadius:8, background:"#4f46e51a", display:"flex", alignItems:"center", justifyContent:"center", border:"1px solid #4f46e544"}}>
            <span style={{fontFamily:"monospace", fontSize:12, fontWeight:800, color:"#818cf8"}}>S</span>
          </div>
          <div style={{fontFamily:"monospace", fontSize:12, fontWeight:700, color:"#818cf8", letterSpacing:2}}>STL</div>
          <div style={{width:1, height:16, background:"#334155"}}/>
          <div style={{fontSize:13, fontWeight:600, color:"#e2e8f0"}}>Admin</div>
          <div style={{padding:"2px 8px", background:"#312e81", borderRadius:4, fontSize:10, fontWeight:700, color:"#a5b4fc", letterSpacing:1}}>FULL ACCESS</div>
        </div>
        <div style={{display:"flex", gap:8}}>
          {wd.isTesting && <div style={{padding:"3px 10px", background:"#713f12", borderRadius:5, fontSize:10, fontWeight:700, color:"#fef08a", letterSpacing:1}}>TEST MODE</div>}

          <button onClick={onLogout} style={{padding:"5px 14px", borderRadius:6, border:"1px solid #334155", background:"transparent", color:"#94a3b8", cursor:"pointer", fontSize:12, fontWeight:600}}>Logout</button>
        </div>
      </div>

      <div style={{maxWidth:1080, margin:"0 auto", padding:"18px 16px"}}>
          <>
            <div style={{background:"#fff", borderRadius:12, padding:"11px 16px", marginBottom:14, border:"1px solid #e2e8f0", boxShadow:"0 1px 4px rgba(0,0,0,0.05)"}}>
              <div style={{display:"flex", alignItems:"center", gap:7, flexWrap:"wrap"}}>
                <span style={{fontSize:9, fontWeight:700, color:"#94a3b8", letterSpacing:1.5, marginRight:2}}>DEPT</span>
                {DEPTS.map(d => (
                  <button key={d.id} onClick={() => setSelDept(d)} style={{
                    padding:"4px 13px", borderRadius:20, cursor:"pointer", fontWeight:600, fontSize:11,
                    border: "2px solid " + (d.id === selDept.id ? d.accent : "#f1f5f9"),
                    background: d.id === selDept.id ? d.accent : "#f8fafc",
                    color: d.id === selDept.id ? "#fff" : "#64748b",
                    transition:"all 0.15s"
                  }}>{d.label}</button>
                ))}
                <div style={{marginLeft:"auto", display:"flex", gap:6}}>
                  {MONTHS.map(m => (
                    <button key={m.key} onClick={() => { setSelMonth(m); setSelDay(m.key === wd.mk ? wd.d : 1); }} style={{
                      padding:"4px 14px", borderRadius:6, cursor:"pointer", fontWeight:700, fontSize:11, fontFamily:"monospace",
                      border: "2px solid " + (m.key === selMonth.key ? "#0f172a" : "#f1f5f9"),
                      background: m.key === selMonth.key ? "#0f172a" : "#f8fafc",
                      color: m.key === selMonth.key ? "#fff" : "#64748b",
                      transition:"all 0.15s"
                    }}>{m.short}</button>
                  ))}
                </div>
              </div>
            </div>

            <div style={{display:"flex", gap:14, alignItems:"flex-start", flexWrap:"wrap"}}>
              <div style={{width:236, flexShrink:0, display:"flex", flexDirection:"column", gap:10}}>
                <DayPicker month={selMonth} selDay={selDay} entries={entries}
                  onSelect={setSelDay} accent={selDept.accent}
                  todayDay={selMonth.key === wd.mk ? wd.d : null}/>
                <div style={{background:"#fff", borderRadius:10, padding:"12px 14px", border:"1px solid #e2e8f0", boxShadow:"0 1px 4px rgba(0,0,0,0.04)"}}>
                  <div style={{fontSize:9, fontWeight:700, color:"#94a3b8", letterSpacing:2}}>SELECTED DATE</div>
                  <div style={{fontSize:17, fontWeight:800, color:"#0f172a", marginTop:5, fontFamily:"monospace"}}>{fmtDate(my,mm,selDay)}</div>
                  <div style={{marginTop:5, fontSize:11, fontWeight:700, color: isPast ? "#ea580c" : "#16a34a"}}>
                    {isPast ? "Editing past data" : "Today's entry"}
                  </div>
                  {selDay === lastDay(selMonth.key) && (
                    <div style={{marginTop:4, fontSize:11, color:"#ea580c", fontWeight:600}}>Last day - monthly KPIs active</div>
                  )}
                </div>
              </div>

              <div style={{flex:1, minWidth:300}}>
                <div style={{marginBottom:10, display:"flex", alignItems:"center", gap:8, flexWrap:"wrap"}}>
                  <span style={{fontSize:15, fontWeight:700, color:selDept.accent}}>{selDept.label}</span>
                  <span style={{fontSize:12, color:"#94a3b8", fontFamily:"monospace"}}>{fmtDate(my,mm,selDay)}</span>
                  {isPast && <span style={{fontSize:11, padding:"2px 9px", borderRadius:4, background:"#fff7ed", border:"1px solid #fed7aa", color:"#ea580c", fontWeight:700}}>Editing past data</span>}
                </div>
                <KpiForm dept={selDept} inputs={inputs} onChange={handleChange}
                  mkey={selMonth.key} isAdmin={true}
                  onSave={handleSave} saving={saving} flash={flash}
                  lockedMonthly={false}/>
              </div>
            </div>
          </>
      </div>
    </div>
  );
}

// -- ROOT ----------------------------------------------------------
function App() {
  // Check if user arrived via OTP login — if so, skip PIN screen entirely
  const otpRole = localStorage.getItem("stl_role");
  const otpDept = localStorage.getItem("stl_dept");
  const otpName = localStorage.getItem("stl_name");
  const otpToken = localStorage.getItem("stl_token");

  // Determine initial screen: if valid OTP session exists, go straight to entry/admin
  function getInitialScreen() {
    if (otpToken && otpRole) {
      if (otpRole === "admin") return "admin";
      return "entry";
    }
    return "login";
  }

  function getInitialRole() {
    if (otpToken && otpRole) {
      // Map OTP role to dept id
      const ROLE_DEPT_MAP = {weaving:"Weaving",dyeing:"Dyeing",finishing:"Finishing",prep:"Prep",gm_tech:"UB",ppc:"PPC",bathrobe:"Bathrobe",quality:"Quality",rsb:"RSB"};
      // dept stored directly, or derive from role
      if (otpDept && otpDept !== "") return otpDept;
      return ROLE_DEPT_MAP[otpRole] || otpRole;
    }
    return null;
  }

  const [screen, setScreen] = useState(getInitialScreen);
  const [role,   setRole]   = useState(getInitialRole);
  const [pins,   setPins]   = useState(() => loadPins());

  function login(r)     { setRole(r); setScreen(r === "admin" ? "admin" : "entry"); }
  function logout()     {
    // Clear OTP session too
    ["stl_token","stl_role","stl_name","stl_dept"].forEach(k => localStorage.removeItem(k));
    setRole(null);
    setScreen("login");
    window.location.href = "login.html";
  }
  function updatePins(np) { const ok = savePins(np); if (ok) setPins(np); return ok; }

  if (screen === "login") return <LoginScreen pins={pins} onLogin={login}/>;
  if (screen === "entry") return <EntryScreen dept={DEPTS.find(d => d.id === role)} onLogout={logout}/>;
  if (screen === "admin") return <AdminScreen pins={pins} onUpdatePins={updatePins} onLogout={logout}/>;
  return null;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
