  h1{font-size:20px;font-weight:700;margin-bottom:6px;}
  p{color:#7c8299;font-size:13px;margin-bottom:16px;line-height:1.6;}

  button{background:#6366f1;color:#fff;border:none;border-radius:10px;padding:14px 32px;font-size:15px;font-weight:700;cursor:pointer;width:100%;margin-bottom:8px;}
  button:disabled{opacity:0.5;cursor:not-allowed;}
  .log{margin-top:20px;text-align:left;font-size:12px;font-family:monospace;background:#0f172a;border-radius:8px;padding:12px;max-height:340px;overflow-y:auto;}
  .ok{color:#1D9E75;} .err{color:#E24B4A;} .info{color:#7c8299;} .warn{color:#f59e0b;}
</style>
</head>
<body>
<div class="card">
  <h1>STL Manpower KV Recovery — Full May 2026</h1>
  <p>Writes all 31 days of May headcount data (from DDR) to Cloudflare KV with a <strong>365-day TTL</strong>. Run once after any KV data loss.<br><br>Paste your Cloudflare API token and click Run.</p>
  <input id="token" type="password" placeholder="Cloudflare API token (needs Workers KV write permission)" />
  <button id="btn" onclick="run()">▶ Run Recovery (May 1–31, 365-day TTL)</button>
  <div class="log" id="log"><span class="info">Paste token and click Run.</span></div>
</div>

function log(msg,cls='info'){const el=document.getElementById('log');el.innerHTML+=`<div class="${cls}">${msg}</div>`;el.scrollTop=el.scrollHeight;}

async function run(){
  const TOKEN=document.getElementById('token').value.trim();
  if(!TOKEN){log('Please paste the API token first.','err');return;}
  const btn=document.getElementById('btn');
  btn.disabled=true; btn.textContent='Running…';
  document.getElementById('log').innerHTML='';
  log('Writing '+DATA.length+' days to KV with 365-day TTL…');
  let ok=0,fail=0;
  for(const e of DATA){
    const key=encodeURIComponent('manpower:'+e.d);
    const value=JSON.stringify({...e.mp,enteredBy:'recovery-ddr',enteredAt:new Date().toISOString()});
    const url=`https://api.cloudflare.com/client/v4/accounts/${ACCOUNT}/storage/kv/namespaces/${NS}/values/${key}?expiration_ttl=${TTL_365}`;
    try{
      const r=await fetch(url,{method:'PUT',headers:{'Authorization':'Bearer '+TOKEN,'Content-Type':'text/plain'},body:value});
      const j=await r.json();
      if(j.success){log(`✓ ${e.d}  weaving=${e.mp.weaving} finishing=${e.mp.finishing}`,'ok');ok++;}
      else{log(`✗ ${e.d}  ${JSON.stringify(j.errors)}`,'err');fail++;}
    }catch(err){log(`✗ ${e.d}  ${err.message}`,'err');fail++;}
  }
  log('');
  log(`Done — ${ok}/31 saved, ${fail} failed.`,ok===31?'ok':'err');
  if(ok===31) log('All May data is now safe in KV for 365 days. The daily bot will also preserve these in stl_data.js from today.','info');
  btn.textContent=ok===31?'✓ Complete':`⚠ ${fail} failed`;
  btn.disabled=false;
}
